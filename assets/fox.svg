<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="foxTitle foxDesc">
  <title id="foxTitle">Лиса — проводник по сказке</title>
  <desc id="foxDesc">Рыжая лиса с золотым шарфом сидит и улыбается.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb06f"/>
      <stop offset=".45" stop-color="#f07e51"/>
      <stop offset="1" stop-color="#c94f42"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd5a4"/>
      <stop offset="1" stop-color="#f4ab7b"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd7b"/>
      <stop offset=".58" stop-color="#ef7b50"/>
      <stop offset="1" stop-color="#b74340"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf8d"/>
      <stop offset="1" stop-color="#d99b43"/>
