<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="castleTitle castleDesc">
  <title id="castleTitle">Сказочный замок с извилистой дорогой</title>
  <desc id="castleDesc">Иллюстрированный замок с золотыми окнами, холмами, деревьями и дорогой, ведущей к воротам.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8c4"/>
      <stop offset=".55" stop-color="#f4c798"/>
      <stop offset="1" stop-color="#d9997c"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ba6c72"/>
      <stop offset=".5" stop-color="#e4a17f"/>
      <stop offset="1" stop-color="#b9686e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d35b79"/>
      <stop offset=".6" stop-color="#a5355c"/>
      <stop offset="1" stop-color="#6d2148"/>
    </linearGradient>
    <linearGradient id="roofDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a83b60"/>
      <stop offset="1" stop-color="#581b3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".48" stop-color="#f2c469"/>
      <stop offset="1" stop-color="#c28b3e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe5b7"/>
      <stop offset=".55" stop-color="#f8cf9b"/>
      <stop offset="1" stop-color="#e6a77e"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a3659"/>
      <stop offset="1" stop-color="#3b2048"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31524f"/>
      <stop offset="1" stop-color="#1b3038"/>
    </linearGradient>
    <linearGradient id="hillLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44274d"/>
      <stop offset="1" stop-color="#26152f"/>
    </linearGradient>
    <radialGradient id="windowGlow">
      <stop offset="0" stop-color="#fff5b9"/>
      <stop offset=".6" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#e49248"/>
    </radialGradient>
    <radialGradient id="doorGlow">
      <stop offset="0" stop-color="#fff8c9" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffcf71" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb85f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

