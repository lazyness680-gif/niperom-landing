<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" role="img" aria-labelledby="cacaoTitle cacaoDesc">
  <title id="cacaoTitle">Какао-плод</title>
  <desc id="cacaoDesc">Иллюстрация какао-плода с листьями и золотыми декоративными элементами.</desc>
  <defs>
