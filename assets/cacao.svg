      <stop offset="0" stop-color="#e79a63"/>
      <stop offset=".5" stop-color="#b95b4e"/>
      <stop offset="1" stop-color="#712d43"/>
    </linearGradient>
    <linearGradient id="podLight" x1="0" y1="0" x2="1" y2="1">
