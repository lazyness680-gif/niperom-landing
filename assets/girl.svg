<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" role="img" aria-labelledby="girlTitle girlDesc">
  <title id="girlTitle">Девочка из сказки</title>
  <desc id="girlDesc">Девочка в berry-пальто с длинными волнистыми волосами держит шоколадку.</desc>
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d75672"/>
      <stop offset=".55" stop-color="#b13a5a"/>
      <stop offset="1" stop-color="#77223f"/>
    </linearGradient>
    <linearGradient id="coatDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#972c4d"/>
      <stop offset="1" stop-color="#6e1c38"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c483f"/>
      <stop offset=".5" stop-color="#5c2b32"/>
      <stop offset="1" stop-color="#3c1c2a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8b1"/>
      <stop offset="1" stop-color="#eab189"/>
